<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Story</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfe6fb;--panel:#ffffff;--ink:#23446b;--pink:#5f82a8;--gold:#4a90d9;--line:rgba(74,144,217,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,#8ec5f5 0%,#b6dafa 40%,#dcedfd 80%,#f1f8ff 100%);background-attachment:fixed;color:var(--ink);font-family:'Pixelify Sans',ui-monospace,Menlo,monospace;min-height:100%;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:28px 18px 40px}
h1{font-size:44px;font-weight:600;margin:0 0 28px;text-align:center;color:#2f5d8c;line-height:1.05;text-shadow:0 1px 14px rgba(255,255,255,.7)}
h1::after{content:'';display:block;width:112px;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,#4a90d9,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{font:inherit;color:inherit;text-align:left;background:rgba(255,255,255,.75);border:1px solid var(--line);padding:18px;cursor:pointer;display:flex;gap:14px;align-items:center;box-shadow:inset 0 0 0 5px rgba(255,255,255,.75),inset 0 0 0 6px rgba(74,144,217,.2),0 6px 18px rgba(74,144,217,.18);transition:border-color .2s}
.card:hover{border-color:var(--gold)}
.card:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.card .ic{font-size:30px}
.card small{display:block;color:var(--pink);font-size:15px}
.card b{font-size:20px;font-weight:600;color:#23446b}
.card.seen{border-color:var(--gold)}
.card.seen small::after{content:" ★ seen"}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#23446b}
.btn{font:inherit;font-size:18px;color:#ffffff;background:linear-gradient(180deg,#6fb1ec,#4a90d9);border:1px solid var(--gold);border-radius:999px;padding:8px 22px;cursor:pointer;box-shadow:0 3px 10px rgba(74,144,217,.35)}
.btn.alt{background:rgba(255,255,255,.75);color:var(--gold);border:1px solid var(--gold);box-shadow:none}
svg{width:100%;height:auto;display:block;border:2px solid var(--line);background:#fff;box-shadow:0 6px 18px rgba(74,144,217,.2)}
#box{display:block;width:100%;font:inherit;color:var(--ink);text-align:left;background:rgba(255,255,255,.85);border:1px solid var(--gold);padding:18px 20px;margin-top:12px;min-height:96px;font-size:20px;line-height:1.35;cursor:pointer;position:relative;box-shadow:inset 0 0 0 5px rgba(255,255,255,.85),inset 0 0 0 6px rgba(74,144,217,.25),0 6px 18px rgba(74,144,217,.18)}
#nxt{position:absolute;right:12px;bottom:8px;color:var(--gold);animation:blink .8s steps(2) infinite}
#end{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center}
[hidden]{display:none!important}
.ch .bob{animation:idle 1.6s ease-in-out infinite alternate}
.walk .bob{animation:bob .25s infinite alternate}
.walk .l{animation:step .25s infinite alternate}
.walk .r{animation:step .25s infinite alternate-reverse}
.low .bob{animation:none;transform:translateY(9px) scaleY(.84)}
.hop .bob{animation:hop .4s ease-out 4}
.pop{font-size:16px;text-anchor:middle;animation:pop 1.8s ease-out both}
.fall{animation:fall 2.6s linear both;transform-box:fill-box;transform-origin:center}
.steam{animation:steam 1.6s ease-in-out infinite}
/* pixel concert stage */
.cs-bob{animation:csBob 1s steps(1,end) infinite}
.cs-bob2{animation:csBob 1.3s steps(1,end) .4s infinite}
.cs-beam-a{animation:csBeam 2.4s steps(2,end) infinite}
.cs-beam-b{animation:csBeam 2.4s steps(2,end) 1.2s infinite}
.cs-twinkle{animation:csTwinkle 1.4s steps(1,end) infinite}
.cs-sign{animation:csSign 2.6s steps(1,end) infinite}
.cs-dance{animation:csDance 1.04s steps(1,end) infinite}
.cs-armA{animation:csArmA 1.04s steps(1,end) infinite}
.cs-armB{animation:csArmB 1.04s steps(1,end) infinite}
.cs-mouth{animation:csMouth .52s steps(1,end) infinite}
.cs-note{animation:csNote 2.4s steps(8,end) infinite;opacity:0}
@keyframes csBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes csBeam{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes csTwinkle{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes csSign{0%,100%{opacity:1}50%{opacity:.82}}
@keyframes csDance{0%{transform:translate(0,0)}25%{transform:translate(-1px,-1px)}50%{transform:translate(0,0)}75%{transform:translate(1px,-1px)}100%{transform:translate(0,0)}}
@keyframes csArmA{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
@keyframes csArmB{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
@keyframes csMouth{0%{opacity:1}70%{opacity:0}100%{opacity:1}}
@keyframes csNote{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-9px)}}
@keyframes idle{to{transform:translateY(-1.5px)}}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes step{to{transform:translateY(-4px)}}
@keyframes hop{50%{transform:translateY(-16px)}}
@keyframes pop{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}
@keyframes fall{to{transform:translateY(260px) rotate(540deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <section id="menu">
    <h1>Our Story</h1>
    <div class="grid" id="grid"></div>
  </section>
  <section id="stage" hidden>
    <div class="bar"><button class="btn alt" id="back">← Chapters</button><span id="ttl"></span></div>
    <svg id="sv" viewBox="0 0 400 240" role="img" aria-label="Animated story scene">
      <g id="bg"></g><g id="G"></g><g id="B"></g><g id="fx"></g>
    </svg>
    <button id="box" aria-live="polite"><span id="dlg"></span><span id="nxt" hidden>▼</span></button>
    <div id="end" hidden>
      <button class="btn alt" id="again">Replay</button>
      <button class="btn" id="next">Next chapter</button>
      <button class="btn alt" id="menuBtn">Chapters</button>
    </div>
  </section>
</main>
<script>
const CH=[
{ic:"👋",t:"How we met",sub:"Chapter 1",S:[
 {bg:"class",look:"uni",t:"We used to be classmates, and back then it was nothing special.",a:async x=>{x.at(110,290);x.low();await x.w(600);x.pop(110,105,"✏️",1);x.pop(290,105,"📖",1);await x.w(1800);}},
 {bg:"street",look:"casual",t:"Years later, we met again in the same city, and this time it felt different.",a:async x=>{x.at(-40,440);await x.w(300);await Promise.all([x.go(x.G,150,2400),x.go(x.B,250,2400)]);x.pop(200,100);}}
]},
{ic:"🎤",t:"Our first date",sub:"Chapter 2",S:[
 {bg:"concert",look:"casual",t:"I took her to see her favorite singer live, her very first time seeing her idol in person.",a:async x=>{x.at(-40,440);await x.w(300);await Promise.all([x.go(x.G,165,2000),x.go(x.B,235,2000)]);x.pop(200,70,"🎶",3);}},
 {bg:"concert",look:"casual",t:"She was the happiest I had ever seen her.",a:async x=>{x.at(165,235);x.hop(x.B);x.pop(235,105,"💖",5);x.pop(235,75,"✨",3);await x.w(2200);}}
]},
{ic:"💐",t:"How we became us",sub:"Chapter 3",S:[
 {bg:"gate",look:"casual",t:"One year later, we went to another concert together.",a:async x=>{x.at(-40,440);await x.w(300);await Promise.all([x.go(x.G,170,2200),x.go(x.B,230,2200)]);x.pop(200,120,"🎫",1);}},
 {bg:"gate",look:"casual",t:"Five minutes before the show, I gave her flowers and asked her to be my girlfriend.",a:async x=>{x.at(140,235);x.pop(200,30,"⏰",1);await x.w(900);await x.go(x.G,195,1400);x.pop(212,115,"💐",1);await x.w(1200);}},
 {bg:"gate",look:"casual",t:"She said yes!",a:async x=>{x.at(195,235);x.hop(x.B);x.pop(215,100,"💖",5);x.rain();await x.w(2400);}}
]},
{ic:"🎉",t:"Our new chapter",sub:"Chapter 4",S:[
 {bg:"path",look:"casual",t:"Day by day, through tears and laughter, we chose to fight for our future together.",a:async x=>{x.at(40,80);const m=Promise.all([x.go(x.G,280,3600),x.go(x.B,320,3600)]);await x.w(800);x.pop(95,105,"😂",1);await x.w(900);x.pop(150,105,"😢",1);await x.w(900);x.pop(220,105,"💪",1);await m;}},
 {bg:"arch",look:"wed",t:"Now the day has finally come.",a:async x=>{x.at(-40,440);await x.w(300);await Promise.all([x.go(x.G,172,2200),x.go(x.B,228,2200)]);x.rain();x.pop(200,100);}},
 {bg:"arch",look:"wed",t:"We’re ready to start our new chapter, and we’d love for you to be in it.",a:async x=>{x.at(172,228);x.hop(x.G);x.hop(x.B);x.pop(200,70,"💌",1);x.pop(200,100);x.rain();await x.w(2600);}}
]}
];

/* ===== Pixel concert stage (drawn on a 100 x 60 grid, scaled x4 to fill the 400 x 240 scene) ===== */
const CP={H:'#4a2e22',S:'#ffd9b8',E:'#1b1b2a',M:'#c4607f',W:'#f4f7fb',J:'#5b86bd',j:'#44688f',X:'#1b2433',T:'#6b7fb0',P:'#1d2a45',n:'#7a5a3a',g:'#c9733a',t:'#b07a62',q:'#8a4fa8',D:'#15151d'};
/* Singer with short hair, in a dress (D = dress color) */
const SINGER=[
'..HHHHH..',
'.HHHHHHH.',
'.HHHHHHH.',
'.HSESESH.',
'.HSSSSSH.',
'..HSMSH..',
'...SSS...',
'.DDDDDDD.',
'.DDDDDDD.',
'.DDDDDDD.',
'.DDDDDDD.',
'DDDDDDDDD',
'..SS.SS..',
'..SS.SS..',
'..SS.SS..',
'..XX.XX..'];
const GUITARIST=[
'...HHHH....',
'..HHHHHH...',
'..HSSSSH...',
'..HSESSH...',
'...SSSS....',
'..TTTTTT...',
'.TTTTTTT...',
'nnnTTggggg.',
'...TTgggggg',
'...TTTggg..',
'...PPPPPP..',
'...PPPPPP..',
'...PP..PP..',
'...XX..XX..'];
const GUITARIST_R=GUITARIST.map(r=>[...r].reverse().join(''));
/* 3x5 pixel letters for the small Chapter 3 sign */
const FONT={
A:['.#.','#.#','###','#.#','#.#'],
B:['##.','#.#','##.','#.#','##.'],
E:['###','#..','##.','#..','###'],
G:['.##','#..','#.#','#.#','.##'],
I:['###','.#.','.#.','.#.','###'],
K:['#.#','#.#','##.','#.#','#.#'],
M:['#.#','###','###','#.#','#.#'],
N:['##.','#.#','#.#','#.#','#.#'],
T:['###','.#.','.#.','.#.','.#.'],
U:['#.#','#.#','#.#','#.#','###'],
Y:['#.#','#.#','.#.','.#.','.#.']};
const SIGN="KITA BUAT MENYENANGKAN";
/* Big pixel letters for the Chapter 2 sign: Bernadya */
const GL=[
{top:0,rows:['####.','#...#','#...#','####.','#...#','#...#','####.']},
{top:2,rows:['.###.','#...#','#####','#....','.###.']},
{top:2,rows:['#.##.','##..#','#....','#....','#....']},
{top:2,rows:['#.##.','##..#','#...#','#...#','#...#']},
{top:2,rows:['.###.','....#','.####','#...#','.####']},
{top:0,rows:['....#','....#','.####','#...#','#...#','#...#','.####']},
{top:2,rows:['#...#','#...#','#...#','.####','....#','....#','.###.']},
{top:2,rows:['.###.','....#','.####','#...#','.####']}];

const spr=(rows,x,y,ov)=>{const p={...CP,...(ov||{})};let o='';rows.forEach((r,ry)=>{[...r].forEach((c,rx)=>{if(c!=='.')o+=`<rect x="${x+rx}" y="${y+ry}" width="1" height="1" fill="${p[c]}"/>`;});});return o;};
const rc=(x,y,c)=>`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
const beam=(fx0,tx,col,cls)=>{let o=`<g class="${cls}" fill="${col}" fill-opacity=".16">`;for(let r=0;r<26;r++){const w=2+Math.floor(r*.3),cx=fx0+(tx-fx0)*r/26;o+=`<rect x="${Math.round(cx-w/2)}" y="${6+r}" width="${w}" height="1"/>`;}return o+'</g>';};
/* little pixel music note */
const NOTE=['.##','.#.','##.','##.'];
/* dancing + singing singer (dc = dress color) */
const singerG=dc=>{const ox=46,oy=16,S='#ffd9b8';
  const P=l=>l.map(p=>rc(ox+p[0],oy+p[1],S)).join('');
  const upL=[[0,7],[-1,6],[-1,5],[-1,4],[-1,3]],dnR=[[8,7],[8,8],[8,9]],dnL=[[0,7],[0,8],[0,9]],upR=[[8,7],[9,6],[9,5],[9,4],[9,3]];
  return `<g class="cs-dance">${spr(SINGER,ox,oy,{D:dc})}<g class="cs-armA">${P(upL)+P(dnR)}</g><g class="cs-armB" opacity="0">${P(dnL)+P(upR)}</g><rect class="cs-mouth" x="${ox+4}" y="${oy+5}" width="1" height="2" fill="#5a1830"/></g>`;};

/* ---- Chapter 2 concert (Bernadya) ---- */
function buildConcert(){
  let o='<g shape-rendering="crispEdges"><rect width="400" height="240" fill="#0b1424"/><g transform="scale(4)">';
  /* truss + lamps */
  o+='<rect x="0" y="1" width="100" height="2" fill="#26334f"/>';
  [[14,'#f59ab9'],[34,'#6fb1ec'],[62,'#6fb1ec'],[82,'#f59ab9']].forEach(a=>{o+=`<rect x="${a[0]}" y="3" width="4" height="3" fill="${a[1]}"/>`;});
  /* LED backdrop */
  o+='<rect x="4" y="6" width="92" height="26" fill="#0e1b33"/>';
  o+='<rect x="4" y="6" width="92" height="1" fill="#2b4a78"/><rect x="4" y="31" width="92" height="1" fill="#2b4a78"/><rect x="4" y="6" width="1" height="26" fill="#2b4a78"/><rect x="95" y="6" width="1" height="26" fill="#2b4a78"/>';
  /* "Bernadya" sign */
  o+='<g class="cs-sign" fill="#f3f8ff">';
  GL.forEach((g,i)=>g.rows.forEach((row,ry)=>[...row].forEach((c,rx)=>{if(c==='#')o+=`<rect x="${7+i*11+rx*2}" y="${10+(g.top+ry)*2}" width="2" height="2"/>`;})));
  o+='</g>';
  /* light beams */
  o+=beam(16,28,'#f59ab9','cs-beam-a')+beam(36,44,'#8fc4f5','cs-beam-b')+beam(64,56,'#8fc4f5','cs-beam-a')+beam(84,72,'#f59ab9','cs-beam-b');
  /* stage deck */
  o+='<rect x="0" y="32" width="100" height="8" fill="#1b2f52"/><rect x="0" y="32" width="100" height="1" fill="#3d6aa5"/><rect x="0" y="38" width="100" height="2" fill="#12203a"/>';
  for(let i=0;i<12;i++)o+=`<rect x="${3+i*8}" y="38" width="2" height="1" fill="#6fb1ec"${i%2?' class="cs-twinkle"':''}/>`;
  /* band */
  o+=`<g class="cs-bob2">${spr(GUITARIST,14,18)}</g>`;
  o+=`<g class="cs-bob">${spr(GUITARIST_R,75,18,{T:CP.t,g:CP.q})}</g>`;
  /* mic stand */
  o+='<rect x="44" y="22" width="1" height="10" fill="#8a97ad"/><rect x="44" y="20" width="2" height="2" fill="#cfd8e6"/>';
  /* singer: black dress, dancing and singing */
  o+=singerG('#15151d');
  /* floating music notes */
  [[57,13,'#f59ab9','0s'],[41,11,'#8fc4f5','.8s'],[51,8,'#ffffff','1.6s']].forEach(n=>{
    o+=`<g class="cs-note" style="animation-delay:${n[3]}">${spr(NOTE,n[0],n[1],{})}</g>`.replace(/fill="[^"]*"/g,'fill="'+n[2]+'"').replace(/<g class="cs-note"/,'<g class="cs-note"');
  });
  /* audience */
  o+='<rect x="0" y="40" width="100" height="20" fill="#0a1120"/>';
  [1,9,17,25,33,41,49,57,66,74,82,90,97].forEach((x,i)=>{
    const y=40+((i*3)%4),c=i%2?'#070c18':'#0a1222';
    o+=`<rect x="${x}" y="${y}" width="6" height="6" fill="${c}"/><rect x="${x-2}" y="${y+6}" width="10" height="20" fill="${c}"/>`;
  });
  /* phone lights */
  [9,33,74,90].forEach((x,i)=>{o+=`<rect x="${x+2}" y="${38+(i%2)}" width="1" height="2" fill="#cfe4f7" class="cs-twinkle"/>`;});
  return o+'</g></g>';
}
const CONCERT=buildConcert();

/* ---- Chapter 3 concert (purple stage, small sign, blue singer) ---- */
const KEYB=['..HHHH..','.HHHHHH.','.HSSSSH.','.HSESSH.','..SSSS..','.TTTTTT.','TTTTTTTT','TTTTTTTT'];
function buildConcert2(){
  let o='<g shape-rendering="crispEdges"><rect width="400" height="240" fill="#1a0b2e"/><g transform="scale(4)">';
  o+='<rect x="0" y="1" width="100" height="2" fill="#3b2368"/>';
  [[8,'#ffd166'],[28,'#5de0e6'],[68,'#5de0e6'],[88,'#ffd166']].forEach(a=>{o+=`<rect x="${a[0]}" y="3" width="4" height="3" fill="${a[1]}"/>`;});
  /* LED screen */
  o+='<rect x="4" y="6" width="92" height="26" fill="#2a1250"/><rect x="4" y="6" width="92" height="1" fill="#7a4bd1"/><rect x="4" y="31" width="92" height="1" fill="#7a4bd1"/><rect x="4" y="6" width="1" height="26" fill="#7a4bd1"/><rect x="95" y="6" width="1" height="26" fill="#7a4bd1"/>';
  /* equalizer bars */
  const cols=['#ff6ad5','#5de0e6','#ffd166'];
  for(let i=0;i<22;i++){const h=3+((i*5)%8);o+=`<rect x="${7+i*4}" y="${30-h}" width="3" height="${h}" fill="${cols[i%3]}" fill-opacity=".55"${i%2?' class="cs-twinkle"':''}/>`;}
  /* small sign: Kita Buat Menyenangkan */
  o+='<g class="cs-sign" fill="#ffe9ff">';
  const w=[...SIGN].reduce((a,c)=>a+(c===' '?3:4),0)-1;let cx=Math.floor(50-w/2);
  [...SIGN].forEach(c=>{if(c===' '){cx+=3;return;}FONT[c].forEach((row,ry)=>[...row].forEach((p,rx)=>{if(p==='#')o+=`<rect x="${cx+rx}" y="${9+ry}" width="1" height="1"/>`;}));cx+=4;});
  o+='</g>';
  o+=beam(12,26,'#ffd166','cs-beam-a')+beam(36,44,'#5de0e6','cs-beam-b')+beam(64,56,'#5de0e6','cs-beam-a')+beam(88,74,'#ffd166','cs-beam-b');
  /* stage */
  o+='<rect x="0" y="32" width="100" height="8" fill="#3a1d66"/><rect x="0" y="32" width="100" height="1" fill="#8a5bd8"/><rect x="0" y="38" width="100" height="2" fill="#241046"/><rect x="34" y="33" width="32" height="1" fill="#b48cff"/>';
  for(let i=0;i<12;i++)o+=`<rect x="${3+i*8}" y="38" width="2" height="1" fill="${i%2?'#5de0e6':'#ffd166'}" class="cs-twinkle"/>`;
  /* keyboardist (left) */
  o+=`<g class="cs-bob2">${spr(KEYB,12,20)}</g><rect x="7" y="28" width="16" height="2" fill="#e8e8f2"/><rect x="7" y="30" width="16" height="2" fill="#2a2a3a"/>`;
  /* drummer (right) */
  o+=`<g class="cs-bob">${spr(KEYB,80,20,{T:'#d96a8a'})}</g><rect x="70" y="23" width="6" height="1" fill="#ffd166"/><rect x="88" y="23" width="6" height="1" fill="#ffd166"/><rect x="73" y="28" width="22" height="4" fill="#e0603a"/><rect x="73" y="28" width="22" height="1" fill="#f4f4f8"/>`;
  /* singer in blue */
  o+='<rect x="44" y="22" width="1" height="10" fill="#8a97ad"/><rect x="44" y="20" width="2" height="2" fill="#cfd8e6"/>';
  o+=singerG('#3f7fd8');
  /* audience with glowsticks */
  o+='<rect x="0" y="40" width="100" height="20" fill="#0d0618"/>';
  [1,9,17,25,33,41,49,57,66,74,82,90,97].forEach((x,i)=>{const y=40+((i*3)%4),c=i%2?'#080312':'#0b0516';o+=`<rect x="${x}" y="${y}" width="6" height="6" fill="${c}"/><rect x="${x-2}" y="${y+6}" width="10" height="20" fill="${c}"/>`;});
  [5,21,37,53,69,85,95].forEach((x,i)=>{o+=`<rect x="${x}" y="${37+(i%2)}" width="1" height="3" fill="${cols[i%3]}" class="cs-twinkle"/>`;});
  return o+'</g></g>';
}
const CONCERT2=buildConcert2();

const BG={
class:`<rect width="400" height="190" fill="#eaf4fd"/><rect x="60" y="30" width="170" height="70" fill="#3d6fa8" stroke="#5f82a8" stroke-width="4"/><text x="145" y="72" fill="#ffffff" font-size="14" text-anchor="middle" font-family="Pixelify Sans,monospace">Class 12-A</text><rect x="280" y="35" width="70" height="60" fill="#bfe3f2" stroke="#5f82a8" stroke-width="4"/><rect y="190" width="400" height="50" fill="#9cc3ea"/><rect x="80" y="150" width="60" height="6" fill="#5f82a8"/><rect x="92" y="156" width="6" height="34" fill="#5f82a8"/><rect x="260" y="150" width="60" height="6" fill="#5f82a8"/><rect x="302" y="156" width="6" height="34" fill="#5f82a8"/>`,
path:`<rect width="400" height="190" fill="#cfe6fb"/><circle cx="330" cy="70" r="26" fill="#fff1b8"/><path d="M0 150Q80 100 160 140T320 130T400 140V190H0Z" fill="#9cc3ea"/><rect y="190" width="400" height="50" fill="#8fc7a5"/><rect y="190" width="400" height="6" fill="#b4dfc0"/>`,
street:`<rect width="400" height="190" fill="#7fb2e5"/><circle cx="330" cy="40" r="18" fill="#fff1b8"/><g fill="#3d6fa8"><rect x="10" y="90" width="60" height="100"/><rect x="80" y="60" width="50" height="130"/><rect x="290" y="80" width="70" height="110"/><rect x="215" y="105" width="55" height="85"/></g><g fill="#fff1b8"><rect x="24" y="106" width="8" height="10"/><rect x="46" y="106" width="8" height="10"/><rect x="94" y="80" width="8" height="10"/><rect x="108" y="110" width="8" height="10"/><rect x="305" y="100" width="8" height="10"/><rect x="335" y="100" width="8" height="10"/></g><rect y="190" width="400" height="50" fill="#5f8fb0"/><rect y="190" width="400" height="6" fill="#7fb0cf"/>`,
concert:CONCERT,
gate:CONCERT2,
cafe:`<rect width="400" height="190" fill="#9cc3ea"/><rect x="150" y="30" width="100" height="70" rx="4" fill="#e6f3ff"/><path d="M200 30V100M150 65H250" stroke="#5f82a8" stroke-width="4"/><rect y="190" width="400" height="50" fill="#7fb2e5"/><rect x="172" y="152" width="56" height="6" fill="#ffffff"/><rect x="196" y="158" width="8" height="32" fill="#ffffff"/><rect x="180" y="142" width="10" height="10" fill="#fff4e0"/><rect x="210" y="142" width="10" height="10" fill="#fff4e0"/><g stroke="#ffffff" fill="none" stroke-width="2"><path class="steam" d="M185 138q-3-5 0-9"/><path class="steam" d="M215 138q-3-5 0-9" style="animation-delay:.6s"/></g>`,
sunset:`<rect width="400" height="190" fill="#bfe0fa"/><circle cx="200" cy="140" r="42" fill="#fff1b8"/><rect y="140" width="400" height="50" fill="#7fb2e5"/><rect y="190" width="400" height="50" fill="#9cc3ea"/>`,
arch:`<rect width="400" height="190" fill="#bfe3f2"/><rect y="190" width="400" height="50" fill="#8fc7a5"/><path d="M145 190V110A55 55 0 0 1 255 110V190" fill="none" stroke="#4a90d9" stroke-width="6"/><g fill="#f7a8bd"><circle cx="145" cy="150" r="7"/><circle cx="145" cy="115" r="7"/><circle cx="160" cy="70" r="7"/><circle cx="200" cy="55" r="7"/><circle cx="240" cy="70" r="7"/><circle cx="255" cy="115" r="7"/><circle cx="255" cy="150" r="7"/></g>`
};
const person=(hair,outfit,bride)=>`<g class="bob"><rect class="lg l" x="-8" y="-16" width="6" height="16" fill="#2f4a73"/><rect class="lg r" x="2" y="-16" width="6" height="16" fill="#2f4a73"/>${bride?`<path d="M-15 -14L-9 -40H9L15 -14Z" fill="${outfit}"/>`:`<rect x="-10" y="-40" width="20" height="26" rx="4" fill="${outfit}"/>`}<circle cy="-53" r="13" fill="#ffd9b8"/><path d="M-14 -53A14 14 0 0 1 14 -53Z" fill="${hair}"/>${bride?`<rect x="-15" y="-56" width="5" height="22" rx="2" fill="${hair}"/><rect x="10" y="-56" width="5" height="22" rx="2" fill="${hair}"/>`:''}<circle cx="-5" cy="-52" r="1.8" fill="#222"/><circle cx="5" cy="-52" r="1.8" fill="#222"/><circle cx="-8" cy="-47" r="2.4" fill="#f7a8bd" opacity=".8"/><circle cx="8" cy="-47" r="2.4" fill="#f7a8bd" opacity=".8"/></g>`;
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
const G=$("G"),B=$("B"),fx=$("fx"),box=$("box"),dlg=$("dlg"),nxt=$("nxt"),end=$("end");
G.setAttribute("class","ch");B.setAttribute("class","ch");
G.innerHTML=person("#2a2233","#5a6bd6",false);
B.innerHTML=person("#6b3a2a","#fff4e0",true);
const seen=new Set();let tok=0,cur=0;

function buildMenu(){
  $("grid").innerHTML="";
  CH.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="card"+(seen.has(i)?" seen":"");
    b.innerHTML=`<span class="ic">${c.ic}</span><span><small>${c.sub}</small><b>${c.t}</b></span>`;
    b.onclick=()=>play(i);
    $("grid").append(b);
  });
}
function toMenu(){tok++;$("stage").hidden=true;$("menu").hidden=false;buildMenu();}
$("back").onclick=$("menuBtn").onclick=toMenu;
$("again").onclick=()=>play(cur);
$("next").onclick=()=>play(cur+1);

function place(el,x){el.style.transition="none";el.style.transform=`translate(${x}px,190px)`;el.getBoundingClientRect();}
const pop=(x,y,e="💖",n=5)=>{for(let k=0;k<n;k++){const t=document.createElementNS(NS,"text");t.setAttribute("x",x+(k-(n-1)/2)*16);t.setAttribute("y",y);t.setAttribute("class","pop");t.style.animationDelay=k*.12+"s";t.textContent=e;fx.append(t);}};
const rain=()=>{for(let k=0;k<36;k++){const r=document.createElementNS(NS,"rect");r.setAttribute("x",Math.random()*400);r.setAttribute("y",-10);r.setAttribute("width",5);r.setAttribute("height",8);r.setAttribute("fill",["#4a90d9","#f7a8bd","#8fc7a5","#ffffff"][k%4]);r.setAttribute("class","fall");r.style.animationDelay=Math.random()*1.5+"s";fx.append(r);}};

const LOOKS={casual:["#2a2233","#5a6bd6","#6b3a2a","#f7a8bd"],uni:["#2a2233","#ffffff","#6b3a2a","#ffffff"],wed:["#2a2233","#2f5d8c","#6b3a2a","#ffffff"]};
const dress=k=>{const l=LOOKS[k],u=k==="uni";G.innerHTML=person(l[0],l[1],false).replace(/<\/g>$/,(u?'<rect x="-2" y="-40" width="4" height="12" fill="#d33"/>':'')+'</g>');B.innerHTML=person(l[2],l[3],true).replace(/<\/g>$/,(u?'<circle cy="-39" r="3" fill="#d33"/>':'')+'</g>');};
async function play(i){
  cur=i;const c=CH[i];
  $("menu").hidden=true;$("stage").hidden=false;end.hidden=true;$("ttl").textContent=c.t;
  try{
    for(const s of c.S){
      const my=++tok;
      const w=ms=>new Promise((r,j)=>setTimeout(()=>tok===my?r():j(),ms));
      const go=(el,px,ms)=>{el.classList.add("walk");el.style.transition=`transform ${ms}ms linear`;el.style.transform=`translate(${px}px,190px)`;return w(ms).then(()=>el.classList.remove("walk"));};
      const say=text=>new Promise((res,rej)=>{
        dlg.textContent="";nxt.hidden=true;let n=0;
        const done=()=>{nxt.hidden=false;box.onclick=()=>{box.onclick=null;res();};};
        const iv=setInterval(()=>{if(tok!==my){clearInterval(iv);rej();return;}dlg.textContent=text.slice(0,++n);if(n>=text.length){clearInterval(iv);done();}},28);
        box.onclick=()=>{if(n<text.length){clearInterval(iv);n=text.length;dlg.textContent=text;done();}};
      });
      [G,B].forEach(e=>e.classList.remove("low","hop","walk"));
      fx.innerHTML="";nxt.hidden=true;dlg.textContent="";
      $("bg").innerHTML=BG[s.bg];dress(s.look);
      const x={G,B,w,go,pop,rain,at:(a,b)=>{place(G,a);place(B,b);},low:()=>[G,B].forEach(e=>e.classList.add("low")),hop:e=>e.classList.add("hop")};
      await Promise.all([s.a(x),say(s.t)]);
    }
    seen.add(i);$("next").hidden=i>=CH.length-1;end.hidden=false;
  }catch(e){}
}
buildMenu();
</script>
</body>
</html>
