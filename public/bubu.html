<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubu's House</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(#8fc4f6,#e6f2ff) #cfe6fb;color:#1d3a6e;
font-family:'Fredoka',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;
padding:16px 12px 28px;touch-action:manipulation}
h1{margin:4px 0 0;font-size:30px}
.back{font-size:14px;color:#1d3a6e}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(100%,720px)}
.hud label{font-size:12px;font-weight:600}
.bar{height:12px;border-radius:8px;background:rgba(255,255,255,.85);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:8px;background:var(--c);transition:width .2s}
canvas{width:min(100%,720px);aspect-ratio:4/3;border-radius:22px;border:5px solid #fff;
box-shadow:0 10px 30px rgba(29,58,110,.25);touch-action:none;background:#e9c79a}
#msg{font-size:15px;font-weight:600;min-height:24px;text-align:center;width:min(100%,720px)}
.ctl{display:flex;gap:26px;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
.pad button,.act{font:inherit;font-weight:700;font-size:18px;color:#1d3a6e;background:#fff;border:0;border-radius:16px;
box-shadow:0 4px 0 #b9d6f5;cursor:pointer;touch-action:none}
.pad button:active,.act:active{transform:translateY(3px);box-shadow:0 1px 0 #b9d6f5}
.act{width:88px;height:88px;border-radius:50%;font-size:16px}
.help{font-size:13px;line-height:1.6;text-align:center;max-width:560px;opacity:.85}
</style>
</head>
<body>
<h1 id="title">Bubu's House</h1>
<a class="back" href="/">&larr; Back to invitation</a>
<div class="hud">
  <label>Food<div class="bar"><i id="b0" style="--c:#f2994a"></i></div></label>
  <label>Water<div class="bar"><i id="b1" style="--c:#4a90e2"></i></div></label>
  <label>Energy<div class="bar"><i id="b2" style="--c:#4caf6a"></i></div></label>
  <label>Joy<div class="bar"><i id="b3" style="--c:#f4668f"></i></div></label>
  <label>Belly<div class="bar"><i id="b4" style="--c:#b48cf2"></i></div></label>
</div>
<canvas id="c" aria-label="Bubu's House. Walk Bubu with the arrow keys or tap items."></canvas>
<div id="msg"></div>
<div class="ctl">
  <div class="pad">
    <span></span><button data-k="up" aria-label="Up">&#9650;</button><span></span>
    <button data-k="left" aria-label="Left">&#9664;</button><button data-k="down" aria-label="Down">&#9660;</button><button data-k="right" aria-label="Right">&#9654;</button>
  </div>
  <button class="act" data-k="act">USE</button>
</div>
<p class="help">Walk with arrow keys or WASD. Press Space (or USE) next to an item, or tap any item and Bubu walks there. Tap Bubu for a meow. Every meal makes his belly rounder!</p>

<script>
if(self!==top)document.querySelector('.back').style.display='none';
const NAME='Bubu';
const $=id=>document.getElementById(id);
const cv=$('c'),x=cv.getContext('2d'),W=640,H=480,K=1.5;
cv.width=W*K;cv.height=H*K;
const GR='#a7afc2',GD='#7d86a0',CR='#f7f3f0',PI='#f58fa8',MAXFAT=1.2;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const ell=(cx,cy,rx,ry,f)=>{x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);if(f){x.fillStyle=f;x.fill()}};
const rr=(a,b,w,h,r,f)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();if(f){x.fillStyle=f;x.fill()}};
const lg=(y0,y1,c0,c1)=>{const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);return g};
const tri=(p,f)=>{x.beginPath();x.moveTo(...p[0]);p.slice(1).forEach(q=>x.lineTo(...q));x.closePath();x.fillStyle=f;x.fill()};
const heart=(cx,cy,s,f)=>{x.fillStyle=f;x.beginPath();x.moveTo(cx,cy+s*.9);x.bezierCurveTo(cx-s*1.6,cy-s*.2,cx-s*.6,cy-s*1.3,cx,cy-s*.4);x.bezierCurveTo(cx+s*.6,cy-s*1.3,cx+s*1.6,cy-s*.2,cx,cy+s*.9);x.fill()};
const paw=(cx,cy,r,f)=>{ell(cx,cy+r*.5,r,r*.8,f);[[-1.1,-.6],[-.4,-1.2],[.4,-1.2],[1.1,-.6]].forEach(([a,b])=>ell(cx+a*r,cy+b*r,r*.38,r*.45,f))};

/* ---------- state ---------- */
const S={hunger:70,thirst:70,energy:80,joy:50},st={plate:true,bowl:true};
let fat=0,fatT=0;
try{fatT=fat=clamp(parseFloat(localStorage.getItem('bubuFat'))||0,0,MAXFAT)}catch(e){}
const DEF='Tap anything and '+NAME+' will go there.';
let mt;const msg=$('msg');
function say(t){msg.textContent=t;clearTimeout(mt);mt=setTimeout(()=>msg.textContent=DEF,4000)}
say('Welcome to '+NAME+"'s House!");

const items={
 bed:{x:40,y:232,w:130,h:78,ix:105,iy:335},
 post:{x:206,y:176,w:44,h:118,ix:228,iy:312},
 bag:{x:436,y:116,w:64,h:84,ix:468,iy:232},
 jug:{x:536,y:108,w:50,h:92,ix:561,iy:232},
 plate:{x:404,y:296,w:72,h:32,ix:440,iy:352},
 bowl:{x:512,y:304,w:68,h:32,ix:546,iy:362},
 plant:{x:34,y:350,w:56,h:84,ix:92,iy:420},
 ball:{x:214,y:392,w:30,h:30,ix:229,iy:438},
 mouse:{x:330,y:412,w:44,h:24,ix:352,iy:450}
};
const cat={x:320,y:350,dir:1,state:'idle',t:0,goal:null,item:null,zoom:0};
let T=0,parts=[],hover=null,hintT=12,pt=0;

/* ---------- room ---------- */
function room(){
 x.fillStyle=lg(0,160,'#d8ecff','#b9daf8');x.fillRect(0,0,W,160);
 x.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<W;i+=40)x.fillRect(i,0,20,110);
 x.fillStyle='#fffaf4';x.fillRect(0,112,W,46);rr(0,104,W,8,0,'#fff');
 x.fillStyle=lg(156,H,'#ecca9d','#d9ae78');x.fillRect(0,156,W,H);
 x.strokeStyle='rgba(150,100,55,.28)';x.lineWidth=1.5;
 for(let y=190,r=0;y<H;y+=42,r++){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();
  for(let xx=(r%2)*70;xx<W;xx+=140){x.beginPath();x.moveTo(xx,y);x.lineTo(xx,y+42);x.stroke()}}
 x.fillStyle='rgba(120,90,60,.22)';x.fillRect(0,156,W,4);
 // window + sunbeam
 x.fillStyle='rgba(255,246,200,.26)';x.beginPath();x.moveTo(64,98);x.lineTo(168,98);x.lineTo(310,330);x.lineTo(170,330);x.fill();
 rr(56,22,120,78,8,'#fff');rr(63,29,106,64,4,lg(29,93,'#9fd0fa','#e6f4ff'));
 ell(92,56,18,8,'rgba(255,255,255,.9)');ell(106,52,14,9,'rgba(255,255,255,.9)');ell(142,70,16,7,'rgba(255,255,255,.8)');
 x.fillStyle='#fff';x.fillRect(113,29,6,64);x.fillRect(63,58,106,5);
 rr(44,14,26,92,10,'#f7b3c6');rr(162,14,26,92,10,'#f7b3c6');rr(38,10,156,7,3,'#a8683a');
 // picture frame
 rr(522,30,64,50,6,'#a8683a');rr(528,36,52,38,3,'#ffe3ea');heart(554,54,9,'#f4668f');
 // bunting
 x.strokeStyle='#8a5a34';x.lineWidth=2;x.beginPath();x.moveTo(110,4);x.quadraticCurveTo(320,34,530,4);x.stroke();
 const bc=['#ff9fb0','#ffd166','#8fd0ff','#b9e6a0'];
 for(let i=0;i<10;i++){const t=.05+i*.1,px=(1-t)*(1-t)*110+2*(1-t)*t*320+t*t*530,py=(1-t)*(1-t)*4+2*(1-t)*t*34+t*t*4;
  tri([[px-10,py],[px+10,py],[px,py+20]],bc[i%4])}
 // sign
 x.strokeStyle='#8a5a34';x.lineWidth=2;x.beginPath();x.moveTo(320,12);x.lineTo(252,48);x.moveTo(320,12);x.lineTo(388,48);x.stroke();
 ell(320,12,4,4,'#d4a24c');
 rr(228,46,184,60,14,lg(46,106,'#dba76f','#b87a45'));x.strokeStyle='#8a5a34';x.lineWidth=3;x.stroke();
 x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;rr(234,52,172,48,10);x.stroke();
 x.fillStyle='#fff6e5';x.font='700 25px Fredoka,sans-serif';x.textAlign='center';x.fillText(NAME+"'s House",320,86);
 paw(248,70,5,'#fff6e5');paw(392,70,5,'#fff6e5');
 // rug
 ell(320,345,176,70,'#f4b9ca');ell(320,345,160,60,'#fde6ec');ell(320,345,118,43,'#f4b9ca');ell(320,345,104,37,'#fff2f5');
 heart(320,345,12,'#f4a0b9');
}

/* ---------- items ---------- */
function drawItem(n,i){
 const a=i.x,b=i.y,w=i.w,h=i.h,cx=a+w/2;
 ell(cx,b+h-2,w*.55,h*.1+3,'rgba(70,45,25,.18)');
 if(n==='bed'){rr(a,b+h*.34,w,h*.58,24,lg(b,b+h,'#ec9ab1','#d6718c'));ell(cx,b+h*.4,w/2,h*.34,'#f7b3c6');ell(cx,b+h*.42,w/2-12,h*.26,'#ffe3ea');ell(a+w*.34,b+h*.38,20,9,'#fff');heart(cx+20,b+h*.43,7,'#f4a0b9')}
 else if(n==='post'){rr(a-8,b+h-14,w+16,14,7,'#a8683a');rr(cx-9,b+16,18,h-28,4,'#e2bd88');x.strokeStyle='#b88a52';x.lineWidth=2;for(let y=b+24;y<b+h-18;y+=8){x.beginPath();x.moveTo(cx-9,y);x.lineTo(cx+9,y+3);x.stroke()}
  rr(a-6,b,w+12,18,9,'#e58aa3');x.strokeStyle='#c9a26b';x.lineWidth=1.5;x.beginPath();x.moveTo(a+w+2,b+14);x.lineTo(a+w+2,b+44+Math.sin(T*3)*3);x.stroke();ell(a+w+2,b+50+Math.sin(T*3)*3,7,7,'#ffd166')}
 else if(n==='bag'){const o=cat.state==='pour'&&cat.item==='bag'?Math.sin(T*30)*3:0;
  rr(a+o,b+14,w,h-14,14,lg(b,b+h,'#f2766b','#c9453d'));tri([[a+o+6,b+16],[a+o+14,b],[a+o+w-14,b],[a+o+w-6,b+16]],'#b93a34');
  ell(cx+o,b+h*.62,22,19,'#fff');paw(cx+o,b+h*.56,7,'#e5534b')}
 else if(n==='jug'){const o=cat.state==='pour'&&cat.item==='jug'?Math.sin(T*30)*3:0;
  rr(a+o+w*.3,b,w*.4,12,4,'#4a90e2');rr(a+o,b+10,w,h-10,18,'rgba(200,230,255,.95)');rr(a+o+5,b+34,w-10,h-42,12,'#7cc0f0');
  x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=3;x.beginPath();x.moveTo(a+o+10,b+26);x.lineTo(a+o+10,b+h-24);x.stroke()}
 else if(n==='plate'){ell(cx,b+h*.62,w/2,h*.4,'#f4a0b9');ell(cx,b+h*.5,w/2-3,h*.36,'#ffe3ea');
  if(st.plate){ell(cx,b+h*.42,w/2-12,h*.28,'#a0522d');for(let k=0;k<9;k++)ell(cx-24+(k%5)*12+(k>4?6:0),b+h*.28+(k>4?5:0),5,3.5,k%2?'#8a4524':'#b8683a')}
  x.fillStyle='#fff';x.font='700 10px Fredoka,sans-serif';x.fillText(NAME,cx,b+h*.9)}
 else if(n==='bowl'){ell(cx,b+h*.62,w/2,h*.4,'#6aaef0');ell(cx,b+h*.5,w/2-3,h*.36,'#d9efff');
  if(st.bowl){ell(cx,b+h*.5,w/2-8,h*.26,'#8fd0ff');x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=1.5;x.beginPath();x.ellipse(cx-8,b+h*.46,8,3,0,0,7);x.stroke()}}
 else if(n==='plant'){rr(a+10,b+52,36,30,8,'#c0694b');ell(cx,b+54,18,5,'#6b4430');
  [-.9,-.45,0,.45,.9].forEach((r,k)=>{x.save();x.translate(cx,b+54);x.rotate(r+Math.sin(T*2+k)*.04);ell(0,-22,7,23,k%2?'#58b86f':'#6ccf8a');x.restore()});
  [[-18,12],[0,2],[16,14]].forEach(([dx,dy])=>{ell(cx+dx,b+dy,6,6,'#c58bff');ell(cx+dx,b+dy,2.4,2.4,'#ffe27a')})}
 else if(n==='ball'){const r=w/2;ell(cx,b+r,r,r,lg(b,b+w,'#ff9db9','#e6638c'));x.strokeStyle='rgba(255,255,255,.65)';x.lineWidth=2;
  x.beginPath();x.arc(cx,b+r,r*.7,.2,2.6);x.stroke();x.beginPath();x.arc(cx,b+r,r*.4,3.4,5.8);x.stroke();
  x.strokeStyle='#e6638c';x.lineWidth=2.5;x.beginPath();x.moveTo(cx+r*.8,b+r*1.5);x.quadraticCurveTo(cx+r*2,b+r*2,cx+r*2.4,b+r*1.5);x.stroke()}
 else{ell(cx,b+14,20,11,'#c9ccd8');ell(cx+8,b+5,7,7,'#ffb3c6');ell(cx+8,b+5,4,4,'#ffd9e2');ell(cx+10,b+12,2.2,2.6,'#2a2230');ell(cx+20,b+15,3,3,PI);
  x.strokeStyle='#ffb3c6';x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(cx-18,b+16);x.quadraticCurveTo(cx-34,b+6,cx-40,b+16);x.stroke()}
 if(hover===n){x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=3;rr(a-4,b-4,w+8,h+8,14);x.stroke()}
}

/* ---------- Bubu ---------- */
function sleepCat(f){
 const rx=46+f*20,ry=22+f*11,br=1+Math.sin(T*2)*.03;x.scale(1,br);
 const hx=rx*.62,hy=-ry-6;
 ell(0,-ry-2,rx,ry,lg(-ry*2,0,'#b8bfd0',GR));
 x.strokeStyle='rgba(90,98,125,.45)';x.lineWidth=4;x.lineCap='round';for(let k=-1;k<=1;k++){x.beginPath();x.moveTo(k*16-4,-ry*2+2);x.lineTo(k*16,-ry*2+12);x.stroke()}
 x.lineWidth=12;x.strokeStyle=GD;x.beginPath();x.moveTo(-rx+8,-8);x.quadraticCurveTo(0,10,rx*.75,-6);x.stroke();
 tri([[hx-18,hy-8],[hx-14,hy-30],[hx-2,hy-14]],GR);tri([[hx+2,hy-14],[hx+14,hy-30],[hx+18,hy-8]],GR);
 ell(hx,hy,23,19,lg(hy-19,hy+19,'#b8bfd0',GR));ell(hx+1,hy+7,11,7,CR);
 x.strokeStyle='#2a2230';x.lineWidth=2.3;[hx-9,hx+11].forEach(ex=>{x.beginPath();x.arc(ex,hy-1,4.5,.1*Math.PI,.9*Math.PI);x.stroke()});
 tri([[hx-2,hy+4],[hx+4,hy+4],[hx+1,hy+8]],PI);ell(hx-15,hy+8,5,3,'rgba(255,130,160,.55)');ell(hx+18,hy+8,5,3,'rgba(255,130,160,.55)');
}
function drawCat(){
 const c=cat,s=c.state,f=fat,sc=1+f*.07;
 x.save();x.translate(c.x,c.y);x.scale(c.dir*sc,sc);
 ell(0,2,44+f*22,9,'rgba(70,45,25,.2)');
 if(s==='sleep'){sleepCat(f);x.restore();return}
 const liv=c.zoom>0?16:9,eating=s==='eat'||s==='drink';
 const bob=s==='walk'?Math.abs(Math.sin(T*liv))*3:s==='play'?Math.abs(Math.sin(T*9))*16:s==='scratch'?Math.abs(Math.sin(T*14))*3:Math.sin(T*2)*.8;
 const brx=32+f*18,bry=19+f*11,by=-bry-14-bob;
 const hx=brx-6+(eating?16:s==='sniff'?8+Math.sin(T*8)*3:0),hy=by-16+(eating?26:s==='sniff'?10:0);
 const wag=Math.sin(T*(s==='walk'?10:3))*8;
 // tail
 x.lineCap='round';x.lineWidth=12;x.strokeStyle=GR;x.beginPath();x.moveTo(-brx+8,by+2);
 x.bezierCurveTo(-brx-28,by+4+wag,-brx-36,by-30+wag,-brx-14,by-42+wag/2);x.stroke();ell(-brx-14,by-42+wag/2,6.5,6.5,GD);
 // legs
 const lift=p=>s==='walk'?Math.max(0,Math.sin(T*liv+p))*7:0;
 [[-brx*.55,0],[brx*.5,Math.PI]].forEach(([lx,p])=>{const l=lift(p),l2=lift(p+Math.PI);
  ell(lx+12,-9-l2,9,12,GD);ell(lx+13,-4-l2,10,5.5,'#e9e6ee');ell(lx,-10-l,11,13,GR);ell(lx+2,-4-l,11,6,CR)});
 // body
 ell(0,by,brx,bry,lg(by-bry,by+bry,'#b8bfd0',GR));
 x.strokeStyle='rgba(90,98,125,.45)';x.lineWidth=4;for(let k=-1;k<=1;k++){x.beginPath();x.moveTo(k*15-4,by-bry+1);x.lineTo(k*15,by-bry+12);x.stroke()}
 ell(brx*.05,by+bry*.5,brx*.72,bry*.55,CR);ell(brx*.15,by+bry*.35,brx*.25,bry*.15,'rgba(255,255,255,.55)');
 // ears + head
 tri([[hx-20,hy-8],[hx-17,hy-34],[hx-3,hy-18]],GR);tri([[hx+3,hy-18],[hx+17,hy-34],[hx+20,hy-8]],GR);
 tri([[hx-17,hy-13],[hx-16,hy-27],[hx-8,hy-18]],'#f7b3c6');tri([[hx+8,hy-18],[hx+16,hy-27],[hx+17,hy-13]],'#f7b3c6');
 ell(hx,hy,25,21,lg(hy-21,hy+21,'#b8bfd0',GR));ell(hx-21,hy+7,9,8,GR);ell(hx+21,hy+7,9,8,GR);
 x.strokeStyle='rgba(90,98,125,.5)';x.lineWidth=2.5;[-6,0,6].forEach(d=>{x.beginPath();x.moveTo(hx+d,hy-20);x.lineTo(hx+d,hy-12);x.stroke()});
 ell(hx+1,hy+8,12,8,CR);
 // eyes
 const blink=(T%4.2)<.14,happy=eating||s==='scratch';
 [[hx-10,hy-2],[hx+12,hy-2]].forEach(([ex,ey])=>{x.strokeStyle='#2a2230';x.lineWidth=2.5;
  if(happy){x.beginPath();x.arc(ex,ey+3,5,Math.PI*1.1,Math.PI*1.9);x.stroke()}
  else if(blink){x.beginPath();x.moveTo(ex-5,ey);x.lineTo(ex+5,ey);x.stroke()}
  else{ell(ex,ey,5.5,7,'#2a2230');ell(ex-1.8,ey-2.6,2.3,2.3,'#fff');ell(ex+1.8,ey+2.2,1,1,'rgba(255,255,255,.75)')}});
 ell(hx-16,hy+9,5.5,3.2,'rgba(255,130,160,.55)');ell(hx+19,hy+9,5.5,3.2,'rgba(255,130,160,.55)');
 tri([[hx-3,hy+4],[hx+5,hy+4],[hx+1,hy+8]],PI);
 x.strokeStyle='#6b5560';x.lineWidth=1.6;
 if(eating)ell(hx+1,hy+12,3.5,Math.abs(Math.sin(T*10))*3.2+.6,'#8a3d52');
 else{x.beginPath();x.arc(hx-2,hy+9,3.5,.1*Math.PI,.9*Math.PI);x.stroke();x.beginPath();x.arc(hx+4,hy+9,3.5,.1*Math.PI,.9*Math.PI);x.stroke()}
 x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=1.2;
 [[-1,-4],[0,0],[1,4]].forEach(([k,d])=>{x.beginPath();x.moveTo(hx-14,hy+9+k*2);x.lineTo(hx-34,hy+9+d);x.stroke();x.beginPath();x.moveTo(hx+17,hy+9+k*2);x.lineTo(hx+37,hy+9+d);x.stroke()});
 // collar + bell
 x.strokeStyle='#e5534b';x.lineWidth=5;x.beginPath();x.arc(hx-2,hy+4,21,.3*Math.PI,.75*Math.PI);x.stroke();
 ell(hx-8.5,hy+24,4.6,4.6,'#ffd166');x.fillStyle='#b8862b';x.fillRect(hx-9,hy+24,1.6,3);
 x.restore();
}

/* ---------- actions ---------- */
const RATE={eat:{hunger:16},drink:{thirst:16},sleep:{energy:12},play:{joy:7},sniff:{joy:10},scratch:{joy:5}};
function burst(ch,col,n=4,px=cat.x,py=cat.y-50){for(let k=0;k<n;k++)parts.push({x:px+Math.random()*30-15,y:py,vx:Math.random()*24-12,vy:-26-Math.random()*20,ch,col,l:1.2})}
function begin(s,d,m){cat.state=s;cat.t=d;cat.goal=null;say(m)}
function use(n){
 const i=items[n];cat.dir=i.x+i.w/2>=cat.x?1:-1;cat.item=n;
 if(n==='plate')return st.plate?begin('eat',3.2,'Nom nom nom...'):say('The plate is empty! Tap the food bag to refill it.');
 if(n==='bowl')return st.bowl?begin('drink',3,'Slurp slurp...'):say('The bowl is empty! Tap the water jug to refill it.');
 if(n==='bag')return st.plate?say('The plate is already full.'):begin('pour',1.2,'Pouring kibble...');
 if(n==='jug')return st.bowl?say('The bowl is already full.'):begin('pour',1.2,'Filling the water bowl...');
 if(n==='bed')return begin('sleep',6,'Zzz... move to wake '+NAME+' up.');
 if(n==='plant')return begin('sniff',2.5,'Sniff sniff... catnip!');
 if(n==='post')return begin('scratch',2.2,'Scratch scratch!');
 begin('play',3,'Pounce!');
}
function finish(){
 const s=cat.state,n=cat.item;cat.state='idle';
 if(s==='eat'){st.plate=false;fatT=Math.min(MAXFAT,fatT+.15);try{localStorage.setItem('bubuFat',fatT)}catch(e){}
  burst('♥','#f4668f');say(fatT>=MAXFAT?NAME+' is a very round cat now!':'Yum! '+NAME+"'s belly got rounder.")}
 else if(s==='drink'){st.bowl=false;burst('♥','#f4668f');say('Ahh! The bowl is empty again.')}
 else if(s==='pour'){if(n==='bag'){st.plate=true;say('Plate refilled!')}else{st.bowl=true;say('Bowl refilled!')}burst('★','#f5c542')}
 else if(s==='sniff'){cat.zoom=6;say('ZOOMIES!')}
 else if(s==='play'){const t=items[n];t.x=70+Math.random()*480;t.y=300+Math.random()*100;t.ix=t.x+t.w/2;t.iy=t.y+t.h+12;
  fatT=Math.max(0,fatT-.03);burst('★','#f5c542');say('The toy bounced away!')}
 else if(s==='sleep')say('Good nap!');
}
function cancel(){cat.goal=null;if(cat.state!=='walk')cat.state='idle'}
function useNearby(){let best=null,bd=60;for(const n in items){const i=items[n],d=Math.hypot(i.ix-cat.x,i.iy-cat.y);if(d<bd){bd=d;best=n}}
 best?use(best):say('Nothing close. Walk next to an item, then press USE.')}

/* ---------- input ---------- */
const keys={up:0,down:0,left:0,right:0};
const KM={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){keys[k]=1;e.preventDefault()}else if(e.key===' '||e.key==='e'||e.key==='E'){e.preventDefault();useNearby()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();k==='act'?useNearby():keys[k]=1});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(k!=='act')keys[k]=0}))});
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function hit(px,py){
 if(Math.abs(px-cat.x)<44&&py>cat.y-80&&py<cat.y+6)return'cat';
 return Object.keys(items).sort((p,q)=>items[q].y+items[q].h-items[p].y-items[p].h).find(n=>{const i=items[n];return px>=i.x&&px<=i.x+i.w&&py>=i.y&&py<=i.y+i.h})}
cv.addEventListener('pointermove',e=>{hover=hit(...pos(e));if(hover==='cat')hover=null;cv.style.cursor=hover?'pointer':'default'});
cv.addEventListener('pointerleave',()=>hover=null);
cv.addEventListener('pointerdown',e=>{
 const [px,py]=pos(e),h=hit(px,py);
 if(h==='cat'){burst('♥','#f4668f',3);S.joy=clamp(S.joy+3);say('Meow!');return}
 cancel();
 cat.goal=h?{x:items[h].ix,y:items[h].iy,item:h}:{x:clamp(px,40,600),y:clamp(py,190,452),item:null};
 cat.state='walk';
});

/* ---------- loop ---------- */
function update(dt){
 T+=dt;
 S.hunger=clamp(S.hunger-.5*dt);S.thirst=clamp(S.thirst-.7*dt);S.energy=clamp(S.energy-.25*dt);S.joy=clamp(S.joy-.35*dt);
 fat+=(fatT-fat)*Math.min(1,dt*1.2);
 const dx=keys.right-keys.left,dy=keys.down-keys.up,sp=(cat.zoom>0?230:105)*(1-.14*fat);
 if(cat.zoom>0){cat.zoom-=dt;fatT=Math.max(0,fatT-.02*dt);pt+=dt;if(pt>.15){pt=0;burst('★','#f5c542',1)}}
 if(dx||dy){
  cancel();cat.state='walk';const m=Math.hypot(dx,dy);
  cat.x=clamp(cat.x+dx/m*sp*dt,40,600);cat.y=clamp(cat.y+dy/m*sp*dt,190,452);if(dx)cat.dir=dx;
 }else if(cat.state==='walk'&&cat.goal){
  const g=cat.goal,ex=g.x-cat.x,ey=g.y-cat.y,d=Math.hypot(ex,ey);
  if(d<3){cat.state='idle';cat.goal=null;if(g.item)use(g.item)}
  else{const m=Math.min(sp*dt,d);cat.x+=ex/d*m;cat.y+=ey/d*m;if(Math.abs(ex)>1)cat.dir=ex>0?1:-1}
 }else if(cat.state==='walk')cat.state='idle';
 else if(RATE[cat.state]||cat.state==='pour'){
  const r=RATE[cat.state];if(r)for(const k in r)S[k]=clamp(S[k]+r[k]*dt);
  if(cat.state==='sleep'&&Math.random()<dt*1.2)burst('z','#1d3a6e',1,cat.x+22,cat.y-60);
  if(cat.state==='play'&&Math.random()<dt*4)burst('★','#f5c542',1);
  cat.t-=dt;if(cat.t<=0)finish();
 }
 parts=parts.filter(p=>(p.l-=dt)>0);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt});
 hintT-=dt;if(hintT<0){hintT=14;const k=Object.keys(S).find(k=>S[k]<25);
  if(k)say({hunger:NAME+' is hungry... tap the food plate!',thirst:NAME+' is thirsty... tap the water bowl!',energy:NAME+' is sleepy... try the bed!',joy:NAME+' is bored... try a toy or the catnip!'}[k])}
 ['hunger','thirst','energy','joy'].forEach((k,i)=>$('b'+i).style.width=S[k]+'%');
 $('b4').style.width=(fat/MAXFAT*100)+'%';
}
function draw(){
 x.setTransform(K,0,0,K,0,0);x.textAlign='center';
 room();
 const list=Object.keys(items).map(n=>({y:items[n].y+items[n].h,f:()=>drawItem(n,items[n])}));
 list.push({y:cat.y,f:drawCat});list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
 parts.forEach(p=>{x.globalAlpha=Math.min(1,p.l*2);if(p.ch==='♥')heart(p.x,p.y,7,p.col);else{x.fillStyle=p.col;x.font='700 18px Fredoka,sans-serif';x.fillText(p.ch,p.x,p.y)}});
 x.globalAlpha=1;
}
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
